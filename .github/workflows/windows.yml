name: Build Windows app
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Configure x64 MSVC build
        run: cmake -S . -B build -A x64
      - name: Compile
        run: cmake --build build --config Release --parallel
      - name: Core and isolated Windows packet-filter tests
        run: ctest --test-dir build -C Release --verbose --output-on-failure
      - name: Package portable app
        shell: pwsh
        run: |
          cmake --install build --config Release --prefix dist
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          (Get-FileHash dist/LagSwitch.exe -Algorithm SHA256).Hash + '  LagSwitch.exe' | Set-Content dist/SHA256SUMS.txt -Encoding ascii
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: LagSwitch-Windows-x64
          path: dist/
          if-no-files-found: error
          retention-days: 30
